zz
        body {

        .container {

            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);

        /* HEADER AND LOGO */

        .header {
            position: relative;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h2 {
            color: maroon;
            text-align: center;
            font-size: 25px;
            margin: 0;
            padding: 0 100px;
        }

        .logo {
            position: absolute;
            top: 0;
            right: 0;
            width: 90px;
            height: 90px;
            object-fit: contain;
        }

        /* FORM ROWS */

        .row {
            display: grid;
            gap: 20px;
            margin-bottom: 20px;
        }

        .two {
            grid-template-columns: 1fr 1fr;
        }

        .three {
            grid-template-columns: 1fr 1fr 1fr;
        }

        /* SECTION HEADINGS */

        .section-title {
            color: maroon;
            border-bottom: 2px solid maroon;
            padding-bottom: 5px;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 18px;
        }

        /* LABELS */

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input, select, textarea {

            font-size: 14px;
            outline: none;
            background-color: white;

        .gender, .radio-group {

<script>

function togglePayment() {

    const payment = document.querySelector(
        'input[name="payment_method"]:checked'
    );

    const cashDetails = document.getElementById("cashDetails");
    const mobileOptions = document.getElementById("mobileOptions");

    if (!payment) {
        return;
    }

    if (payment.value === "Cash") {

        cashDetails.style.display = "block";
        mobileOptions.style.display = "none";

        // Clear mobile provider selection
        document.querySelectorAll(
            'input[name="mobile_provider"]'
        ).forEach(input => input.checked = false);

    } 
    
    else if (payment.value === "Mobile Payment") {

        cashDetails.style.display = "none";
        mobileOptions.style.display = "block";

        // Clear cash details
        document.getElementById("amount_paid").value = "";
        document.getElementById("receiver").value = "";
        document.getElementById("date_paid").value = "";

    }

}

let lastPayment = null;

function togglePayment(selected) {

    // If the user clicks the already selected option
    if (lastPayment === selected.value) {

        selected.checked = false;
        lastPayment = null;

        // Hide all payment options
        document.getElementById("cashDetails").style.display = "none";
        document.getElementById("mobileOptions").style.display = "none";

        // Clear mobile provider selection
        document.querySelectorAll(
            'input[name="mobile_provider"]'
        ).forEach(input => input.checked = false);

        return;
    }

    // Remember the newly selected payment
    lastPayment = selected.value;

    // Display the correct payment details
    document.getElementById("cashDetails").style.display =
        selected.value === "Cash" ? "block" : "none";

    document.getElementById("mobileOptions").style.display =
        selected.value === "Mobile Payment" ? "block" : "none";

    // Clear mobile provider when switching payment methods
    document.querySelectorAll(
        'input[name="mobile_provider"]'
    ).forEach(input => input.checked = false);

}
 


// RESET PAYMENT DETAILS

function resetPayment() {

    document.getElementById("cashDetails").style.display = "none";

    document.getElementById("mobileOptions").style.display = "none";

}

</script>

    function toggleMobilePayment(show) {

            mobileOptions.style.display = "none";
            // Uncheck sub-options when hidden
            const subInputs = mobileOptions.querySelectorAll("input");
            subInputs.forEach(input => input.checked = false);
        }
    }

    document.getElementById("patientForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        alert("Patient Registered Successfully!");

        this.reset();
        toggleMobilePayment(false);

    });

</script>
